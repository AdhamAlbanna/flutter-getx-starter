name: flutter_getx_starter
description: "A scalable Flutter starter: GetX, strict UI/logic separation, a centralized network layer, and Arabic / English localization with RTL."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  get: ^4.7.3
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
